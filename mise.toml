# Toolchain pins for contributors who do not already have a global mise setup.
# Keep these aligned with lara-stacker: its own mise.toml owns the host toolchain,
# and its `PHP_VERSION` owns the PHP-FPM container image.
[plugins]
php = 'https://github.com/verzly/mise-php#latest'

[tools]
node = '22'
php = '8.4'
pnpm = '11'

[env]
# Run `pint`, `pest`, `phpstan`, `prettier`, and `blade-formatter` without a prefix.
_.path = [
  '{{config_root}}/vendor/bin',
  '{{config_root}}/node_modules/.bin',
]

# Extensions PIE has to add, because the source build does not bundle them:
#   redis   — REDIS_CLIENT=phpredis drives the cache *and* the session store.
#   imagick — spatie/image (via goodm4ven/blurred-image) picks Imagick when it is
#             loaded and silently falls back to GD otherwise, which changes output.
#             Needs `brew install imagemagick` present at build time.
# Everything else the app requires is already compiled in by default: bcmath, exif,
# gd, intl, mbstring, pcntl (Reverb), sockets (Pest browser tests), zip, iconv,
# pdo_mysql, pdo_sqlite, and the standard ctype/dom/filter/xml family.
# This only takes effect when mise installs PHP; it deliberately matches
# lara-stacker's own mise.toml so both resolve to the same build.
_.php = { pie_extensions = 'phpredis/phpredis imagick/imagick' }

# `composer dev` and the native watch scripts are long-running by design.
COMPOSER_PROCESS_TIMEOUT = '0'

# Deliberately NOT set here:
#
# 1. `_.file = { path = '.env' }` — mise would export `.env` into the real process
#    environment. PHPUnit only applies a `<env>` entry from phpunit.xml when the
#    variable is still unset (`$force || getenv($name) === false`), and none of ours
#    use `force="true"`. So exporting `.env` silently defeats every override: tests
#    would run with `APP_ENV=local` against the `muttasiq` MySQL database — and
#    `tests/Pest.php` applies `RefreshDatabase` to both suites. Laravel loads `.env`
#    itself, so there is nothing to gain here. Anything that genuinely needs a shell
#    variable belongs in this `[env]` block instead.
#
# 2. `prebuilt_static` / `prebuilt_static_flavor` — the static builds cannot take PIE
#    extensions, so they ship no `phpredis`, and this app needs it for both the cache
#    and the session store. The source build above is what makes `pie_extensions`
#    work at all; pinning a static flavour would hand contributors a PHP that boots
#    but cannot serve a session.

# Tasks below only wrap the `.scripts/` helpers, which have no Composer equivalent.
# Everything else stays in composer.json so there is a single source of truth —
# use `composer run <script>` (or `composer run --list`) for dev/format/lint/test.

[tasks.install]
description = 'Install PHP and JavaScript dependencies'
run = [
  'composer install --no-interaction',
  'pnpm install',
]

[tasks.'watch:web']
description = 'Run the web stack (server, queue, Reverb, logs, Vite)'
run = './.scripts/watch-web.sh'

[tasks.'watch:android']
description = 'Watch the Android app over the Tailscale Funnel'
run = './.scripts/watch-android.sh'

[tasks.'watch:ios']
description = 'Watch the iOS app over the local-source broadcast'
run = './.scripts/watch-ios.sh'

[tasks.'log:android']
description = 'Collect Android logs'
run = './.scripts/log-android.sh'

[tasks.'log:ios']
description = 'Collect iOS logs'
run = './.scripts/log-ios.sh'

[tasks.'publish:android']
description = 'Publish the Android app'
run = './.scripts/publish-android.sh'

[tasks.'publish:ios']
description = 'Publish the iOS app'
run = './.scripts/publish-ios.sh'

[tasks.'env:toggle']
description = 'Toggle .env between development and production identities'
run = './.scripts/toggle-dev-production.sh'

[tasks.'plugins:switch']
description = 'Switch muttasiq-patches between the local path and the released package'
run = './.scripts/composer-local-plugins-switch.sh'
