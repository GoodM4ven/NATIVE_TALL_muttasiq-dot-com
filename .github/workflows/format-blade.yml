name: Format Blade files

on:
  push:
    branches: [dev]
    paths:
      - 'resources/views/**/*.blade.php'
  pull_request:
    branches: [dev]
    paths:
      - 'resources/views/**/*.blade.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Blade formatting
        run: pnpm exec blade-formatter --check-formatted --config .bladeformatterrc "resources/views/**/*.blade.php"
