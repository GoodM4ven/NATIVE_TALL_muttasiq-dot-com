name: Format CSS and JS files

on:
  push:
    branches: [dev]
    paths:
      - 'resources/css/**/*.css'
      - 'resources/js/**/*.js'
  pull_request:
    branches: [dev]
    paths:
      - 'resources/css/**/*.css'
      - 'resources/js/**/*.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Prettier formatting
        run: pnpm exec prettier --check --config .prettierrc "resources/{css,js}/**/*.{css,js}"
